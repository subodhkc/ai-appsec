  # R6.4: Context Window Overflow Risk - Python
  - id: ai-context-overflow-python
    languages: [python]
    pattern-either:
      - pattern: |
          $MESSAGES.append({"role": "user", "content": $USER_INPUT})
    message: "User input appended to messages without length validation - context window overflow risk."
