  # ============================================
  # INJECTION & XSS (Category 11 - R11.1-R11.3)
  # ============================================

  # R11.1: AI Output XSS (JS/TS — rc.5: fixed cosmetic metavariable FP with taint mode)
  - id: ai-xss-js
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: $OPENAI.chat.completions.create(...)
      - pattern: $ANTHROPIC.messages.create(...)
      - pattern: $LLM.invoke(...)
      - pattern: $CHAIN.run(...)
      - pattern: $CHAIN.invoke(...)
      - pattern: $RESPONSE = $OPENAI.chat.completions.create(...)
      - pattern: $RESPONSE = $ANTHROPIC.messages.create(...)
    pattern-sinks:
      - pattern: $EL.innerHTML = $X
      - pattern: document.write($X)
      - pattern: $EL.dangerouslySetInnerHTML = $X
    message: "AI output rendered as HTML without sanitization - XSS vulnerability. Sanitize before rendering."
    severity: ERROR
    metadata:
      category: injection
      cwe: "CWE-79"
      rule_id: R11.1
      compliance_frameworks: ["SOC2", "ISO27001", "OWASP"]
      soc2_controls: ["CC6.1", "CC7.2"]
      iso27001_controls: ["A.12.6.1"]
      owasp_categories: ["A03:2021-Injection"]

  # R11.1: AI Output XSS (Python — render_template_string is Flask-specific)
  - id: ai-xss-python
    languages: [python]
    pattern-either:
      - pattern: |
          $RESPONSE = $LLM.invoke(...)
          ...
          render_template_string($RESPONSE)
    message: "AI output rendered as HTML without sanitization - XSS vulnerability. Sanitize before rendering."
    severity: ERROR
    metadata:
      category: injection
      cwe: "CWE-79"
      rule_id: R11.1
      compliance_frameworks: ["SOC2", "ISO27001", "OWASP"]
      soc2_controls: ["CC6.1", "CC7.2"]
      iso27001_controls: ["A.12.6.1"]
      owasp_categories: ["A03:2021-Injection"]

  # R11.2: AI Output SQL Injection (Python — f-strings and cursor.execute are Python-only)
  - id: ai-sql-injection-python
    languages: [python]
    pattern-either:
      - pattern-regex: 'f["'']SELECT.*\{[^}]+\}.*["'']'
      - pattern-regex: '"SELECT.*"\s*\+\s*\$[A-Za-z_]+"'
      - pattern: |
          cursor.execute(f"... {$LLM_RESPONSE} ...")
    message: "AI output used in SQL query without parameterization - SQL injection risk. Use parameterized queries."
    severity: ERROR
    metadata:
      category: injection
      cwe: "CWE-89"
      rule_id: R11.2
      compliance_frameworks: ["SOC2", "ISO27001", "OWASP"]
      soc2_controls: ["CC6.1", "CC7.2"]
      iso27001_controls: ["A.12.6.1"]
      owasp_categories: ["A03:2021-Injection"]

  # R11.2: AI Output SQL Injection (JS/TS — template literals and string concat)
  - id: ai-sql-injection-js
    languages: [javascript, typescript]
    pattern-either:
      - pattern-regex: '"SELECT.*"\s*\+\s*\$[A-Za-z_]+"'
      - pattern: |
          $DB.query(`... ${$AI_OUTPUT} ...`)
    message: "AI output used in SQL query without parameterization - SQL injection risk. Use parameterized queries."
    severity: ERROR
    metadata:
      category: injection
      cwe: "CWE-89"
      rule_id: R11.2
      compliance_frameworks: ["SOC2", "ISO27001", "OWASP"]
      soc2_controls: ["CC6.1", "CC7.2"]
      iso27001_controls: ["A.12.6.1"]
      owasp_categories: ["A03:2021-Injection"]

  # R11.3: AI Output SSRF (Python — requests.get and urllib are Python-only)
  - id: ai-ssrf-python
    languages: [python]
    pattern-either:
      - pattern: |
          $URL = $LLM.invoke(...)
          ...
          requests.get($URL)
      - pattern: |
          $URL = $RESPONSE.content
          ...
          urllib.request.urlopen($URL)
    message: "AI-generated URL used in server-side request - SSRF risk. Validate and allowlist URLs."
    severity: ERROR
    metadata:
      category: injection
      cwe: "CWE-918"
      rule_id: R11.3
      compliance_frameworks: ["SOC2", "ISO27001", "OWASP"]
      soc2_controls: ["CC6.1", "CC7.2"]
      iso27001_controls: ["A.12.6.1"]
      owasp_categories: ["A10:2021-Server-Side Request Forgery"]

  # R11.3: AI Output SSRF (JS/TS — fetch is JS-only)
  # R11.3: AI Output SSRF (JS/TS — rc.5: fixed cosmetic metavariable FP with taint mode)
  - id: ai-ssrf-js
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: $OPENAI.chat.completions.create(...)
      - pattern: $ANTHROPIC.messages.create(...)
      - pattern: $LLM.invoke(...)
      - pattern: $CHAIN.run(...)
      - pattern: $CHAIN.invoke(...)
      - pattern: $RESPONSE = $OPENAI.chat.completions.create(...)
      - pattern: $RESPONSE = $ANTHROPIC.messages.create(...)
    pattern-sinks:
      - pattern: fetch($URL)
      - pattern: axios.get($URL)
      - pattern: axios.post($URL)
      - pattern: $HTTP.request($URL)
    message: "AI-generated URL used in server-side request - SSRF risk. Validate and allowlist URLs."
    severity: ERROR
    metadata:
      category: injection
      cwe: "CWE-918"
      rule_id: R11.3
      compliance_frameworks: ["SOC2", "ISO27001", "OWASP"]
      soc2_controls: ["CC6.1", "CC7.2"]
      iso27001_controls: ["A.12.6.1"]
      owasp_categories: ["A10:2021-Server-Side Request Forgery"]

