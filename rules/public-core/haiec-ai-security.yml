  # R6.5: Chain-of-Thought Exposure
  - id: ai-cot-exposure
    languages: [python, javascript, typescript]
    pattern-either:
      - pattern: |
          $RESPONSE = $LLM.invoke(...)
          ...
          return $RESPONSE
      - pattern: |
          $RESPONSE = $CHAIN.run(...)
          ...
          return $RESPONSE
    message: "LLM response returned directly - may expose chain-of-thought reasoning to end users."
    severity: INFO
    metadata:
      category: agent_safety
      cwe: "CWE-200"
      rule_id: R6.5
      compliance_frameworks: ["SOC2"]
      soc2_controls: ["CC6.1"]

  # R6.6: Function Calling Without Schema Validation - Python
  - id: ai-function-calling-python
    languages: [python]
    pattern-either:
      - pattern: |
          functions=[{..., "parameters": {...}, ...}]
      - pattern: |
          tools=[{"type": "function", ...}]
      - pattern: |
          tool_choice="auto"
    message: "Function calling detected - ensure schema validation on function arguments from AI."
    severity: INFO
    metadata:
      category: agent_safety
      cwe: "CWE-20"
      rule_id: R6.6
      compliance_frameworks: ["SOC2", "ISO27001"]
      soc2_controls: ["CC7.2"]
      iso27001_controls: ["A.12.6.1"]

  # R6.6: Function Calling Without Schema Validation - JavaScript/TypeScript
  - id: ai-function-calling-js
    languages: [javascript, typescript]
    pattern-either:
      - pattern-regex: 'tool_choice\\s*:\\s*[\"\\x27]auto[\"\\x27]'
      - pattern-regex: 'functions\s*:\s*\['
    message: "Function calling detected - ensure schema validation on function arguments from AI."
    severity: INFO
    metadata:
