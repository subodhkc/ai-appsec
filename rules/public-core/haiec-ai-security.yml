
rules:
  # R1: Prompt Injection - OpenAI Python (Enhanced patterns)
  - id: ai-prompt-injection-openai
    languages: [python]
    pattern-either:
      # Direct module calls
      - pattern: openai.chat.completions.create(...)
      - pattern: openai.ChatCompletion.create(...)
      # Client instance calls
      - pattern: $CLIENT.chat.completions.create(...)
      - pattern: $CLIENT.completions.create(...)
      # Assignment patterns (most common)
      - pattern: $VAR = openai.ChatCompletion.create(...)
      - pattern: $VAR = openai.chat.completions.create(...)
      - pattern: $VAR = $CLIENT.chat.completions.create(...)
      # Patterns with model parameter explicitly
      - pattern: |
          openai.ChatCompletion.create(
            model=...,
            ...
          )
      - pattern: |
          $CLIENT.chat.completions.create(
            model=...,
            ...
          )
    message: "OpenAI API call detected - review for prompt injection vulnerabilities"
    severity: WARNING
    metadata:
      category: prompt_injection
      cwe: "CWE-77"
      rule_id: R1
      compliance_frameworks: ["SOC2", "ISO27001", "OWASP", "GDPR", "HIPAA"]
      soc2_controls: ["CC7.2", "CC8.1"]
      iso27001_controls: ["A.12.6.1"]
      owasp_categories: ["LLM01:2023-Prompt Injection"]
      owasp_top_10: ["A03:2021-Injection"]

  # R1-import: Detect OpenAI import (evidence of AI usage)
  - id: ai-openai-import
    languages: [python]
    pattern-either:
      - pattern: import openai
      - pattern: from openai import $X
    message: "OpenAI library imported - AI functionality detected"
    severity: INFO
    metadata:
      category: ai_detection
      rule_id: R1-import

  # R1-anthropic-import: Detect Anthropic import
  - id: ai-anthropic-import
    languages: [python]
    pattern-either:
      - pattern: import anthropic
      - pattern: from anthropic import $X
    message: "Anthropic library imported - AI functionality detected"
    severity: INFO
    metadata:
      category: ai_detection
      rule_id: R1-anthropic-import

  # R1b: Prompt Injection - OpenAI JavaScript
  - id: ai-prompt-injection-openai-js
    languages: [javascript, typescript]
    pattern-either:
      - pattern: openai.chat.completions.create(...)
      - pattern: $CLIENT.chat.completions.create(...)
      - pattern: new OpenAI(...).chat.completions.create(...)
    message: "User input may flow to AI prompt - review for prompt injection"
    severity: WARNING
    metadata:
      category: prompt_injection
      cwe: "CWE-77"
      rule_id: R1

  # R1c: Prompt Injection - Anthropic (Enhanced patterns)
  - id: ai-prompt-injection-anthropic
    languages: [python, javascript, typescript]
    pattern-either:
      # Direct calls
      - pattern: anthropic.messages.create(...)
      - pattern: $CLIENT.messages.create(...)
      - pattern: Anthropic(...).messages.create(...)
      # Assignment patterns
      - pattern: $VAR = $CLIENT.messages.create(...)
      - pattern: $VAR = anthropic.messages.create(...)
    message: "Anthropic Claude API call detected - review for prompt injection"
    severity: WARNING
    metadata:
      category: prompt_injection
      cwe: "CWE-77"
      rule_id: R1

  # R1d: Prompt Injection - LangChain (Enhanced patterns)
  - id: ai-prompt-injection-langchain
    languages: [python, javascript, typescript]
    pattern-either:
      # Chain patterns - LangChain-specific class names
      - pattern: LLMChain(...).run(...)
      - pattern: LLMChain(...).invoke(...)
      - pattern: ConversationChain(...).run(...)
      - pattern: RetrievalQA.from_chain_type(...)
      - pattern: ChatOpenAI(...)
      - pattern: ChatAnthropic(...)
      # LLM predict (LangChain-specific)
      - pattern: $LLM.predict(...)
      # LLMChain creation
      - pattern: LLMChain(llm=..., ...)
      - pattern: $VAR = LLMChain(...)
      # Agent patterns
      - pattern: AgentExecutor(...)
      - pattern: initialize_agent(...)
      # JS/TS LangChain patterns
      - pattern: new ChatOpenAI(...)
      - pattern: new ChatAnthropic(...)
    message: "LangChain usage detected - review for prompt injection"
    severity: WARNING
    metadata:
      category: prompt_injection
      cwe: "CWE-77"
      rule_id: R1

  # R1d-langchain-import: Detect LangChain import
  - id: ai-langchain-import
    languages: [python]
    pattern-either:
      - pattern: from langchain import $X
      - pattern: from langchain.llms import $X
      - pattern: from langchain.chains import $X
      - pattern: from langchain.agents import $X
    message: "LangChain library imported - AI functionality detected"
    severity: INFO
    metadata:
      category: ai_detection
      rule_id: R1-langchain-import

  # R1e: Prompt Injection - LlamaIndex
  - id: ai-prompt-injection-llamaindex
    languages: [python]
    pattern-either:
      - pattern: VectorStoreIndex.from_documents(...).as_query_engine().query(...)
      - pattern: $INDEX.as_query_engine().query(...)
      - pattern: $INDEX.as_query_engine(...)
      - pattern: $INDEX.as_retriever(...)
      - pattern: GPTVectorStoreIndex.from_documents(...)
      - pattern: ServiceContext.from_defaults(...)
      - pattern: StorageContext.from_defaults(...)
    message: "User input flows through LlamaIndex - review for prompt injection"
    severity: WARNING
    metadata:
      category: prompt_injection
      cwe: "CWE-77"
      rule_id: R1

  # R1f: Prompt Injection - Hugging Face
  - id: ai-prompt-injection-huggingface
    languages: [python]
    pattern-either:
      - pattern: pipeline(...)(...)
      - pattern: $MODEL.generate(...)
      - pattern: AutoModelForCausalLM.from_pretrained(...).generate(...)
    message: "User input flows to Hugging Face model - review for prompt injection"
    severity: WARNING
    metadata:
      category: prompt_injection
      cwe: "CWE-77"
      rule_id: R1

  # R1g: Prompt Injection - Google AI
  - id: ai-prompt-injection-google
    languages: [python]
    pattern-either:
      - pattern: $MODEL.generate_content(...)
      - pattern: genai.GenerativeModel(...).generate_content(...)
    message: "User input flows to Google AI - review for prompt injection"
    severity: WARNING
    metadata:
      category: prompt_injection
      cwe: "CWE-77"
      rule_id: R1

  # R2: Tool Abuse - Dangerous tools (Enhanced)
  - id: ai-tool-abuse-dangerous
    languages: [python]
    pattern-either:
      - pattern: PythonREPLTool(...)
      - pattern: ShellTool(...)
      - pattern: BashProcess(...)
      # LangChain Tool with shell/command execution
      - pattern: |
          Tool(
            ...,
            func=lambda $X: os.popen($X).read(),
            ...
          )
      - pattern: |
          Tool(
            name="Shell",
            ...
          )
    message: "Dangerous tool that could allow code execution"
    severity: ERROR
    metadata:
      category: tool_abuse
      cwe: "CWE-94"
      rule_id: R2

  # R2b: Tool Abuse - AI Output flows to code/shell execution (Taint Tracking)
  - id: ai-tool-abuse-output-exec
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: $LLM.invoke(...)
      - pattern: $LLM.predict(...)
      - pattern: openai.chat.completions.create(...)
      - pattern: $CLIENT.chat.completions.create(...)
      - pattern: anthropic.messages.create(...)
      - pattern: $CLIENT.messages.create(...)
      - pattern: $CHAIN.run(...)
      - pattern: $CHAIN.invoke(...)
    pattern-sinks:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
    message: "AI output flows to code/shell execution - CRITICAL command injection risk. Sanitize AI output before execution."
    severity: ERROR
    metadata:
      category: tool_abuse
      cwe: "CWE-94"
      rule_id: R2

  # R2c: Dangerous lambda with shell execution
  - id: ai-dangerous-lambda-shell
    languages: [python]
    pattern-either:
      - pattern: 'lambda $X: os.popen($X).read()'
      - pattern: 'lambda $X: os.system($X)'
      - pattern: 'lambda $X: subprocess.run($X, ...)'
    message: "Lambda with shell execution - dangerous if used with AI agents"
    severity: ERROR
    metadata:
      category: tool_abuse
      cwe: "CWE-94"
      rule_id: R2

  # R3: RAG Poisoning - Vector stores
  - id: ai-rag-poisoning
    languages: [python, javascript, typescript]
    pattern-either:
      - pattern: $VECTORSTORE.add_documents(...)
      - pattern: $VECTORSTORE.add_texts(...)
      - pattern: Chroma.from_documents(...)
      - pattern: FAISS.from_documents(...)
      - pattern: pinecone.$INDEX.upsert(...)
      - pattern: $INDEX.upsert(...)
      - pattern: $COLLECTION.add(...)
    message: "Documents added to vector store - validate for RAG poisoning"
    severity: WARNING
    metadata:
      category: rag_poisoning
      cwe: "CWE-20"
      rule_id: R3

  # R4: Model Extraction
  - id: ai-model-extraction
    languages: [python]
    pattern-either:
      - pattern: torch.save($MODEL, ...)
      - pattern: $MODEL.save_pretrained(...)
      - pattern: joblib.dump($MODEL, ...)
      - pattern: pickle.dump($MODEL, ...)
    message: "Model weights potentially exposed - risk of model extraction"
    severity: WARNING
    metadata:
      category: model_extraction
      cwe: "CWE-200"
      rule_id: R4

  # R5: Hardcoded API Keys - Python (Enhanced patterns)
  - id: hardcoded-api-key-python
    languages: [python]
    patterns:
      - pattern-either:
          - pattern-regex: '(openai\.api_key|OPENAI_API_KEY|api_key|API_KEY|SECRET_KEY|HARDCODED_KEY)\s*=\s*["'']sk-[A-Za-z0-9_-]{20,}["'']'
      - pattern-not-regex: 'sk-(your|xxx|placeholder|example|test|demo|sample)'
    message: "Hardcoded API key detected - use environment variables instead"
    severity: ERROR
    metadata:
      category: secrets_exposure
      cwe: "CWE-798"
      rule_id: R5

  - id: hardcoded-api-key-js
    languages: [javascript, typescript]
    pattern-either:
      - pattern-regex: 'const\s+apiKey\s*=\s*["'']sk-[A-Za-z0-9-]+'
      - pattern-regex: 'OPENAI_API_KEY\s*=\s*["'']sk-[A-Za-z0-9-]+'
    message: "Hardcoded API key in JavaScript/TypeScript"
    severity: ERROR
    metadata:
      category: secrets_exposure

  # R6.8: Memory/RAG Injection
  - id: ai-memory-injection
    languages: [python]
    pattern-either:
      - pattern: Memory(...)
      - pattern: ConversationSummaryMemory(...)
      - pattern: $MEMORY.save_context(...)
      - pattern: $MEMORY.load_memory_variables(...)
    message: "AI memory system detected - review for memory poisoning attacks"
    severity: WARNING
    metadata:
      category: rag_security
      cwe: "CWE-20"
      rule_id: R6.8

  # R5.2: Hardcoded Anthropic API Keys - Python
  - id: hardcoded-anthropic-api-key-python
    languages: [python]
    pattern-either:
      - pattern-regex: 'api_key\s*=\s*["'']sk-ant-[A-Za-z0-9-]+'
      - pattern: ANTHROPIC_API_KEY = "sk-ant-..."
      - pattern-regex: "(sk-ant-[A-Za-z0-9-]{95})"
    message: "Hardcoded Anthropic API key detected - use environment variables or secrets manager instead."
    severity: ERROR
    metadata:
      category: secrets_exposure
      cwe: "CWE-798"
      rule_id: R5.2
      compliance_frameworks: ["SOC2", "GDPR", "HIPAA", "ISO27001", "OWASP"]
      soc2_controls: ["CC6.6", "CC6.7"]
      gdpr_controls: ["Art32"]
      hipaa_controls: ["164.312(a)(2)(iv)"]
      iso27001_controls: ["A.9.4.3", "A.10.1.1"]
      owasp_categories: ["A02:2021-Cryptographic Failures"]

  # R5.2: Hardcoded Anthropic API Keys - JavaScript
  - id: hardcoded-anthropic-api-key-js
    languages: [javascript, typescript]
    pattern-either:
      - pattern-regex: 'const\s+apiKey\s*=\s*["'']sk-ant-[A-Za-z0-9-]+'
      - pattern: const ANTHROPIC_API_KEY = "sk-ant-..."
      - pattern-regex: "(sk-ant-[A-Za-z0-9-]{95})"
    message: "Hardcoded Anthropic API key detected - use environment variables or secrets manager instead."
    severity: ERROR
    metadata:
      category: secrets_exposure
      cwe: "CWE-798"
      rule_id: R5.2
      compliance_frameworks: ["SOC2", "GDPR", "HIPAA", "ISO27001", "OWASP"]
      soc2_controls: ["CC6.6", "CC6.7"]
      gdpr_controls: ["Art32"]
      hipaa_controls: ["164.312(a)(2)(iv)"]
      iso27001_controls: ["A.9.4.3", "A.10.1.1"]
      owasp_categories: ["A02:2021-Cryptographic Failures"]

  # R5.3: API Keys in Logs - Python (rc.4: fixed cosmetic metavariable FP)
  - id: api-key-in-logs-python
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: logging.debug(..., $KEY, ...)
          - pattern: logging.info(..., $KEY, ...)
          - pattern: logger.debug(..., $KEY, ...)
          - pattern: logger.info(..., $KEY, ...)
          - pattern: print(..., $KEY, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: "(?i).*(api_key|apikey|api-key|secret|token|password|passwd|credential|private_key|access_key|auth_token).*"
    message: "API key or secret may be logged - remove sensitive data from logs immediately."
    severity: WARNING
    metadata:
      category: secrets_exposure
      cwe: "CWE-532"
      rule_id: R5.3
      compliance_frameworks: ["SOC2", "GDPR", "HIPAA", "ISO27001"]
      soc2_controls: ["CC6.6", "CC7.2"]
      gdpr_controls: ["Art32"]
      hipaa_controls: ["164.312(a)(1)"]
      iso27001_controls: ["A.9.4.1"]

  # R5.3: API Keys in Logs - JavaScript/TypeScript (rc.4: fixed cosmetic metavariable FP)
  - id: api-key-in-logs-js
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: console.log(..., $KEY, ...)
          - pattern: console.debug(..., $KEY, ...)
          - pattern: console.error(..., $KEY, ...)
          - pattern: console.warn(..., $KEY, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: "(?i).*(api_key|apikey|api-key|secret|token|password|passwd|credential|private_key|access_key|auth_token).*"
    message: "API key or secret may be logged - remove sensitive data from logs immediately."
    severity: WARNING
    metadata:
      category: secrets_exposure
      cwe: "CWE-532"
      rule_id: R5.3
      compliance_frameworks: ["SOC2", "GDPR", "HIPAA", "ISO27001"]
      soc2_controls: ["CC6.6", "CC7.2"]
      gdpr_controls: ["Art32"]
      hipaa_controls: ["164.312(a)(1)"]
      iso27001_controls: ["A.9.4.1"]

  # R5.4: API Keys in Error Messages - Python
  - id: api-key-in-error-python
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: raise Exception(..., $API_KEY, ...)
          - pattern: raise ValueError(..., $API_KEY, ...)
      - metavariable-regex:
          metavariable: $API_KEY
          regex: "(?i).*(api_key|apikey|api-key|secret|token|password|passwd|credential|private_key|privatekey|access_key|accesskey|auth_token).*"
    message: "API key may be exposed in error messages - sanitize error responses."
    severity: WARNING
    metadata:
      category: secrets_exposure
      cwe: "CWE-209"
      rule_id: R5.4
      compliance_frameworks: ["SOC2", "GDPR", "ISO27001"]
      soc2_controls: ["CC6.6", "CC7.2"]
      gdpr_controls: ["Art32"]
      iso27001_controls: ["A.9.4.1"]

  # R5.4: API Keys in Error Messages - JavaScript
  - id: api-key-in-error-js
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: throw new Error(..., $API_KEY, ...)
          - pattern: throw new Error($API_KEY)
      - metavariable-regex:
          metavariable: $API_KEY
          regex: "(?i).*(api_key|apikey|api-key|secret|token|password|passwd|credential|private_key|privatekey|access_key|accesskey|auth_token).*"
    message: "API key may be exposed in error messages - sanitize error responses."
    severity: WARNING
    metadata:
      category: secrets_exposure
      cwe: "CWE-209"
      rule_id: R5.4
      compliance_frameworks: ["SOC2", "GDPR", "ISO27001"]
      soc2_controls: ["CC6.6", "CC7.2"]
      gdpr_controls: ["Art32"]
      iso27001_controls: ["A.9.4.1"]

  # R5.5: API Keys in URLs - Python
  - id: api-key-in-url-python
    languages: [python]
    pattern-either:
      - pattern-regex: 'f["''].*\?api_key=\{[^}]+\}.*["'']'
    message: "API key in URL parameter - use Authorization header instead to prevent exposure in logs."
    severity: ERROR
    metadata:
      category: secrets_exposure
      cwe: "CWE-598"
      rule_id: R5.5
      compliance_frameworks: ["SOC2", "ISO27001", "OWASP"]
      soc2_controls: ["CC6.6", "CC6.7"]
      iso27001_controls: ["A.9.4.3"]
      owasp_categories: ["A02:2021-Cryptographic Failures"]

  # R5.5: API Keys in URLs - JavaScript
  - id: api-key-in-url-js
    languages: [javascript, typescript]
    pattern-either:
      - pattern-regex: '`[^`]*\?api_key=\$\{[^}]+\}[^`]*`'
      - pattern: |
          $URL = "...?api_key=" + $KEY
    message: "API key in URL parameter - use Authorization header instead to prevent exposure in logs."
    severity: ERROR
    metadata:
      category: secrets_exposure
      cwe: "CWE-598"
      rule_id: R5.5
      compliance_frameworks: ["SOC2", "ISO27001", "OWASP"]
      soc2_controls: ["CC6.6", "CC6.7"]
      iso27001_controls: ["A.9.4.3"]
      owasp_categories: ["A02:2021-Cryptographic Failures"]

  # ============================================
  # DATA LEAKAGE & PRIVACY (Category 7 - R7.1-R7.6)
  # ============================================

  # R7.1: PII in LLM Prompts (Taint Tracking)
  - id: pii-in-llm-prompt
    languages: [python, javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: $USER.email
      - pattern: $USER.ssn
      - pattern: $USER.phone
      - pattern: $USER.credit_card
      - pattern: $CUSTOMER.email
      - pattern: $CUSTOMER.ssn
    pattern-sinks:
      - pattern: openai.chat.completions.create(...)
      - pattern: anthropic.messages.create(...)
      - pattern: $LLM.invoke(...)
      - pattern: $LLM.predict(...)
    message: "PII detected flowing to LLM prompt - implement data anonymization before sending to external APIs."
    severity: ERROR
    metadata:
      category: data_leakage
      cwe: "CWE-359"
      rule_id: R7.1
      compliance_frameworks: ["SOC2", "GDPR", "HIPAA", "ISO27001"]
      soc2_controls: ["CC6.1", "CC6.6"]
      gdpr_controls: ["Art5", "Art25", "Art32"]
      hipaa_controls: ["164.502(a)", "164.514(a)"]
      iso27001_controls: ["A.8.2.3", "A.18.1.4"]

  # R7.2: Sensitive Database Fields in Prompts - Python
  - id: sensitive-db-fields-in-prompt-python
    languages: [python]
    pattern-either:
      - pattern: |
          $PROMPT = f"...{$ROW['password']}..."
      - pattern: |
          $PROMPT = f"...{$USER.ssn}..."
      - pattern: |
          $PROMPT = f"...{$USER.password}..."
    message: "Sensitive database field sent to LLM - mask or exclude sensitive data before processing."
    severity: WARNING
    metadata:
      category: data_leakage
      cwe: "CWE-359"
      rule_id: R7.2
      compliance_frameworks: ["SOC2", "GDPR", "HIPAA", "ISO27001"]
      soc2_controls: ["CC6.1", "CC6.6"]
      gdpr_controls: ["Art5", "Art32"]
      hipaa_controls: ["164.514(a)"]
      iso27001_controls: ["A.8.2.3"]

  # R7.2: Sensitive Database Fields in Prompts - JavaScript
  - id: sensitive-db-fields-in-prompt-js
    languages: [javascript, typescript]
    pattern-either:
      - pattern: |
          $PROMPT = `...${$USER.password}...`
      - pattern: |
          $PROMPT = `...${$ROW.ssn}...`
    message: "Sensitive database field sent to LLM - mask or exclude sensitive data before processing."
    severity: WARNING
    metadata:
      category: data_leakage
      cwe: "CWE-359"
      rule_id: R7.2
      compliance_frameworks: ["SOC2", "GDPR", "HIPAA", "ISO27001"]
      soc2_controls: ["CC6.1", "CC6.6"]
      gdpr_controls: ["Art5", "Art32"]
      hipaa_controls: ["164.514(a)"]
      iso27001_controls: ["A.8.2.3"]

  # R7.3: Missing Data Minimization - Python
  - id: missing-data-minimization-python
    languages: [python]
    pattern-either:
      - pattern: |
          $PROMPT = f"...{json.dumps($USER.__dict__)}..."
      - pattern: |
          $PROMPT = f"...{$USER.__dict__}..."
      - pattern: |
          $LLM.invoke(..., json.dumps($OBJ), ...)
    message: "Entire object sent to LLM - implement data minimization by including only necessary fields."
    severity: INFO
    metadata:
      category: data_leakage
      cwe: "CWE-359"
      rule_id: R7.3
      compliance_frameworks: ["GDPR", "SOC2"]
      soc2_controls: ["CC6.1"]
      gdpr_controls: ["Art5"]

  # R7.3: Missing Data Minimization - JavaScript
  - id: missing-data-minimization-js
    languages: [javascript, typescript]
    pattern-either:
      - pattern: |
          $PROMPT = `...${JSON.stringify($USER)}...`
    message: "Entire object sent to LLM - implement data minimization by including only necessary fields."
    severity: INFO
    metadata:
      category: data_leakage
      cwe: "CWE-359"
      rule_id: R7.3
      compliance_frameworks: ["GDPR", "SOC2"]
      soc2_controls: ["CC6.1"]
      gdpr_controls: ["Art5"]

  # R7.4: LLM Response Not Scanned for PII
  - id: llm-response-pii-not-filtered
    languages: [python, javascript, typescript]
    pattern-either:
      - pattern: |
          $RESPONSE = $LLM.predict(...)
          ...
          $DB.save($RESPONSE)
      - pattern: |
          $RESPONSE = $LLM.invoke(...)
          ...
          return $RESPONSE
      - pattern: |
          $RESPONSE = openai.chat.completions.create(...)
          ...
          database.insert($RESPONSE)
    message: "LLM response not scanned for PII before storage/display - implement response filtering."
    severity: WARNING
    metadata:
      category: data_leakage
      cwe: "CWE-200"
      rule_id: R7.4
      compliance_frameworks: ["GDPR", "HIPAA", "SOC2"]
      soc2_controls: ["CC6.1"]
      gdpr_controls: ["Art5", "Art32"]
      hipaa_controls: ["164.514(a)"]

  # R7.5: Training Data Leakage
  - id: training-data-leakage
    languages: [python]
    pattern-either:
      - pattern: $MODEL.fit($SENSITIVE_DATA)
      - pattern: $TRAINER.train($CUSTOMER_DATA)
      - pattern: fine_tune(..., training_data=$SENSITIVE, ...)
    message: "Model trained on sensitive data without privacy protections - implement differential privacy or data anonymization."
    severity: INFO
    metadata:
      category: data_leakage
      cwe: "CWE-359"
      rule_id: R7.5
      compliance_frameworks: ["GDPR", "SOC2", "ISO27001"]
      soc2_controls: ["CC6.1"]
      gdpr_controls: ["Art5", "Art25"]
      iso27001_controls: ["A.8.2.3"]

  # R7.6: Embeddings Contain Sensitive Data (Taint Tracking)
  - id: embeddings-sensitive-data
    languages: [python, javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: $USER.ssn
      - pattern: $USER.email
      - pattern: $CUSTOMER.credit_card
      - pattern: $PATIENT.medical_record
    pattern-sinks:
      - pattern: $EMBEDDINGS.embed_documents(...)
      - pattern: OpenAIEmbeddings().embed_query(...)
