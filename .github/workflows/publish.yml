name: AI AppSec Publish

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: 'Qualification workflow run ID that produced the canonical tarball'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name from qualification workflow'
        required: true
        type: string
        default: 'canonical-tarball'
      expected_sha256:
        description: 'Expected SHA-256 of the canonical tarball'
        required: true
        type: string
      version:
        description: 'Version to publish (e.g. 0.1.0-rc.3)'
        required: true
        type: string
      dist_tag:
        description: 'npm dist-tag (next for prerelease, latest for stable)'
        required: true
        type: choice
        default: 'next'
        options:
          - next
          - latest

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    name: Publish to npm via OIDC Trusted Publishing
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm CLI
        run: npm install -g npm@latest

      - name: Download canonical tarball from qualification run
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ./tarball
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Verify tarball exists and compute SHA-256
        id: sha
        run: |
          set -euo pipefail
          TARBALL=$(ls ./tarball/*.tgz | head -1)
          if [ -z "$TARBALL" ]; then
            echo "ERROR: No tarball found in artifact"
            exit 1
          fi
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          ACTUAL_SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "Actual SHA-256: $ACTUAL_SHA256"
          echo "Expected SHA-256: ${{ inputs.expected_sha256 }}"
          if [ "$ACTUAL_SHA256" != "${{ inputs.expected_sha256 }}" ]; then
            echo "SHA-256 MISMATCH — refusing to publish"
            echo "qualificationRunId=${{ inputs.qualification_run_id }}"
            echo "artifactName=${{ inputs.artifact_name }}"
            echo "expectedSha256=${{ inputs.expected_sha256 }}"
            echo "actualSha256=$ACTUAL_SHA256"
            exit 1
          fi
          echo "SHA-256 verified — tarball matches qualification artifact"
          echo "actualSha256=$ACTUAL_SHA256" >> $GITHUB_OUTPUT

      - name: Inspect package identity inside tarball
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$TMPDIR"
          PKG_JSON="$TMPDIR/package/package.json"
          if [ ! -f "$PKG_JSON" ]; then
            echo "ERROR: package.json not found in tarball"
            exit 1
          fi
          PKG_NAME=$(node -p "require('$PKG_JSON').name")
          PKG_VERSION=$(node -p "require('$PKG_JSON').version")
          PKG_MCPNAME=$(node -p "require('$PKG_JSON').mcpName || ''")
          PKG_LICENSE=$(node -p "require('$PKG_JSON').license")
          PKG_REPO=$(node -p "require('$PKG_JSON').repository?.url || ''")
          PKG_BIN=$(node -p "Object.keys(require('$PKG_JSON').bin || {}).join(', ')")

          echo "Package name: $PKG_NAME"
          echo "Package version: $PKG_VERSION"
          echo "Package mcpName: $PKG_MCPNAME"
          echo "Package license: $PKG_LICENSE"
          echo "Package repository: $PKG_REPO"
          echo "Package bin: $PKG_BIN"

          if [ "$PKG_NAME" != "ai-appsec" ]; then
            echo "ERROR: package name mismatch — expected ai-appsec, got $PKG_NAME"
            exit 1
          fi
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "ERROR: version mismatch — expected ${{ inputs.version }}, got $PKG_VERSION"
            exit 1
          fi
          if [ "$PKG_MCPNAME" != "io.github.subodhkc/ai-appsec" ]; then
            echo "ERROR: mcpName mismatch — expected io.github.subodhkc/ai-appsec, got $PKG_MCPNAME"
            exit 1
          fi
          if [ "$PKG_LICENSE" != "MIT" ]; then
            echo "ERROR: license mismatch — expected MIT, got $PKG_LICENSE"
            exit 1
          fi
          if [[ "$PKG_REPO" != *"github.com/subodhkc/ai-appsec"* ]]; then
            echo "ERROR: repository mismatch — expected github.com/subodhkc/ai-appsec, got $PKG_REPO"
            exit 1
          fi
          if [[ "$PKG_BIN" != *"ai-appsec"* ]]; then
            echo "ERROR: bin does not contain ai-appsec"
            exit 1
          fi

          # Dist-tag safety: prerelease versions must use 'next', not 'latest'
          VERSION="${{ inputs.version }}"
          DIST_TAG="${{ inputs.dist_tag }}"
          if [[ "$VERSION" == *"-rc."* ]] || [[ "$VERSION" == *"-beta."* ]] || [[ "$VERSION" == *"-alpha."* ]]; then
            if [ "$DIST_TAG" == "latest" ]; then
              echo "ERROR: prerelease version $VERSION cannot use 'latest' dist-tag"
              exit 1
            fi
          fi

          echo "Package identity verified — all checks passed"
          rm -rf "$TMPDIR"

      - name: Publish to npm via OIDC (Trusted Publishing)
        run: |
          npm publish "$TARBALL" --tag "$DIST_TAG" --provenance --access public
        env:
          DIST_TAG: ${{ inputs.dist_tag }}

      - name: Verify publication
        run: |
          sleep 10
          npm view ai-appsec@${{ inputs.version }} dist.integrity
          npm view ai-appsec dist-tags --json
