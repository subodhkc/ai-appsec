name: AI AppSec Publish

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: 'Qualification workflow run ID that produced the canonical tarball'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name from qualification workflow'
        required: true
        type: string
        default: 'canonical-tarball'
      expected_sha256:
        description: 'Expected SHA-256 of the canonical tarball'
        required: true
        type: string
      expected_source_sha:
        description: 'Expected source commit SHA from qualification run'
        required: true
        type: string
      version:
        description: 'Version to publish (e.g. 0.1.0-rc.3)'
        required: true
        type: string
      dist_tag:
        description: 'npm dist-tag (next for prerelease, latest for stable)'
        required: true
        type: choice
        default: 'next'
        options:
          - next
          - latest

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    name: Publish to npm via OIDC Trusted Publishing
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 10

    steps:
      - name: Verify publish workflow source SHA matches expected
        run: |
          set -euo pipefail
          ACTUAL_SHA="${{ github.sha }}"
          EXPECTED_SHA="${{ inputs.expected_source_sha }}"
          echo "Publish workflow GITHUB_SHA: $ACTUAL_SHA"
          echo "Expected source SHA: $EXPECTED_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Source SHA mismatch — refusing to publish"
            echo "publishWorkflowSha=$ACTUAL_SHA"
            echo "expectedSourceSha=$EXPECTED_SHA"
            exit 1
          fi
          echo "Source SHA verified — publish workflow matches qualification source"

      - name: Verify qualification run succeeded with expected source SHA
        id: qual
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.qualification_run_id }}"
          EXPECTED_SHA="${{ inputs.expected_source_sha }}"
          EXPECTED_REPO="subodhkc/ai-appsec"
          EXPECTED_WORKFLOW=".github/workflows/phase-4c-cross-platform.yml"

          # Fetch qualification run details via GitHub API
          RUN_DATA=$(gh api "/repos/${{ github.repository }}/actions/runs/$RUN_ID" 2>&1)
          if [ $? -ne 0 ]; then
            echo "ERROR: Cannot fetch qualification run $RUN_ID"
            echo "$RUN_DATA"
            exit 1
          fi

          RUN_STATUS=$(echo "$RUN_DATA" | node -p "JSON.parse(require('fs').readFileSync(0)).status")
          RUN_CONCLUSION=$(echo "$RUN_DATA" | node -p "JSON.parse(require('fs').readFileSync(0)).conclusion")
          RUN_HEAD_SHA=$(echo "$RUN_DATA" | node -p "JSON.parse(require('fs').readFileSync(0)).head_sha")
          RUN_REPO=$(echo "$RUN_DATA" | node -p "JSON.parse(require('fs').readFileSync(0)).repository.full_name")
          RUN_WORKFLOW=$(echo "$RUN_DATA" | node -p "JSON.parse(require('fs').readFileSync(0)).path")

          echo "qualificationRunId=$RUN_ID"
          echo "qualificationStatus=$RUN_STATUS"
          echo "qualificationConclusion=$RUN_CONCLUSION"
          echo "qualificationHeadSha=$RUN_HEAD_SHA"
          echo "qualificationRepository=$RUN_REPO"
          echo "qualificationWorkflow=$RUN_WORKFLOW"
          echo "expectedSourceSha=$EXPECTED_SHA"

          if [ "$RUN_STATUS" != "completed" ]; then
            echo "ERROR: Qualification run is not completed (status: $RUN_STATUS)"
            exit 1
          fi
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "ERROR: Qualification run did not succeed (conclusion: $RUN_CONCLUSION)"
            exit 1
          fi
          if [ "$RUN_HEAD_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Qualification head SHA mismatch"
            echo "qualificationHeadSha=$RUN_HEAD_SHA"
            echo "expectedSourceSha=$EXPECTED_SHA"
            exit 1
          fi
          if [ "$RUN_REPO" != "$EXPECTED_REPO" ]; then
            echo "ERROR: Qualification run is from wrong repository: $RUN_REPO"
            exit 1
          fi
          if [ "$RUN_WORKFLOW" != "$EXPECTED_WORKFLOW" ]; then
            echo "ERROR: Qualification run is from wrong workflow: $RUN_WORKFLOW"
            exit 1
          fi

          echo "Qualification run verified — all checks passed"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm CLI to verified version
        run: |
          npm install -g npm@11.5.1
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Download canonical tarball from qualification run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ./tarball
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Verify tarball exists and compute SHA-256
        id: sha
        run: |
          set -euo pipefail
          TARBALL=$(ls ./tarball/*.tgz 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            echo "ERROR: No tarball found in artifact"
            exit 1
          fi
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          ACTUAL_SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "Actual SHA-256: $ACTUAL_SHA256"
          echo "Expected SHA-256: ${{ inputs.expected_sha256 }}"
          if [ "$ACTUAL_SHA256" != "${{ inputs.expected_sha256 }}" ]; then
            echo "SHA-256 MISMATCH — refusing to publish"
            echo "qualificationRunId=${{ inputs.qualification_run_id }}"
            echo "artifactName=${{ inputs.artifact_name }}"
            echo "expectedSha256=${{ inputs.expected_sha256 }}"
            echo "actualSha256=$ACTUAL_SHA256"
            exit 1
          fi
          echo "SHA-256 verified — tarball matches qualification artifact"
          echo "actualSha256=$ACTUAL_SHA256" >> $GITHUB_OUTPUT

      - name: Inspect package identity inside tarball
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$TMPDIR"
          PKG_JSON="$TMPDIR/package/package.json"
          if [ ! -f "$PKG_JSON" ]; then
            echo "ERROR: package.json not found in tarball"
            exit 1
          fi
          PKG_NAME=$(node -p "require('$PKG_JSON').name")
          PKG_VERSION=$(node -p "require('$PKG_JSON').version")
          PKG_MCPNAME=$(node -p "require('$PKG_JSON').mcpName || ''")
          PKG_LICENSE=$(node -p "require('$PKG_JSON').license")
          PKG_REPO=$(node -p "require('$PKG_JSON').repository?.url || ''")
          PKG_BIN=$(node -p "Object.keys(require('$PKG_JSON').bin || {}).join(', ')")

          echo "Package name: $PKG_NAME"
          echo "Package version: $PKG_VERSION"
          echo "Package mcpName: $PKG_MCPNAME"
          echo "Package license: $PKG_LICENSE"
          echo "Package repository: $PKG_REPO"
          echo "Package bin: $PKG_BIN"

          if [ "$PKG_NAME" != "ai-appsec" ]; then
            echo "ERROR: package name mismatch — expected ai-appsec, got $PKG_NAME"
            exit 1
          fi
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "ERROR: version mismatch — expected ${{ inputs.version }}, got $PKG_VERSION"
            exit 1
          fi
          if [ "$PKG_MCPNAME" != "io.github.subodhkc/ai-appsec" ]; then
            echo "ERROR: mcpName mismatch — expected io.github.subodhkc/ai-appsec, got $PKG_MCPNAME"
            exit 1
          fi
          if [ "$PKG_LICENSE" != "MIT" ]; then
            echo "ERROR: license mismatch — expected MIT, got $PKG_LICENSE"
            exit 1
          fi
          if [[ "$PKG_REPO" != *"github.com/subodhkc/ai-appsec"* ]]; then
            echo "ERROR: repository mismatch — expected github.com/subodhkc/ai-appsec, got $PKG_REPO"
            exit 1
          fi
          if [[ "$PKG_BIN" != *"ai-appsec"* ]]; then
            echo "ERROR: bin does not contain ai-appsec"
            exit 1
          fi

          # Dist-tag safety: prerelease versions must use 'next', not 'latest'
          VERSION="${{ inputs.version }}"
          DIST_TAG="${{ inputs.dist_tag }}"
          if [[ "$VERSION" == *"-rc."* ]] || [[ "$VERSION" == *"-beta."* ]] || [[ "$VERSION" == *"-alpha."* ]]; then
            if [ "$DIST_TAG" == "latest" ]; then
              echo "ERROR: prerelease version $VERSION cannot use 'latest' dist-tag"
              exit 1
            fi
          fi

          echo "Package identity verified — all checks passed"
          rm -rf "$TMPDIR"

      - name: Publish to npm via OIDC (Trusted Publishing)
        run: |
          npm publish "$TARBALL" --tag "$DIST_TAG" --provenance --access public
        env:
          DIST_TAG: ${{ inputs.dist_tag }}

      - name: Verify publication
        run: |
          sleep 10
          npm view ai-appsec@${{ inputs.version }} dist.integrity
          npm view ai-appsec dist-tags --json



